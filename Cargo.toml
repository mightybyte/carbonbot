[package]
name = "carbonbot"
version = "2.12.3"
authors = ["soulmachine <soulmachine@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4"
crypto-crawler = "4.7"
crypto-market-type = "1.1"
crypto-msg-type = "1.0"
crypto-ws-client = "4.12"
once_cell = "1.17.1"
redis = "0.22.3"
reopen = { version = "1.0.3", features = ["signals"] }
serde_json = "1.0.93"
signal-hook = { version = "0.3.15", features = ["extended-siginfo"] }
log = "0.4.17"
env_logger = "0.10.0"
tokio = { version = "1.25.0", features = ["rt-multi-thread", "macros"] }

protobuf = { version = "=3.5.0" }

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1
opt-level="z"

[patch.crates-io]
crypto-crawler = { git = "https://github.com/mightybyte/crypto-crawler-rs.git", branch = "binance-us", subdirectory = "crypto-crawler" }
crypto-markets = { git = "https://github.com/mightybyte/crypto-crawler-rs.git", branch = "binance-us", subdirectory = "crypto-markets" }
crypto-market-type = { git = "https://github.com/mightybyte/crypto-crawler-rs.git", branch = "binance-us", subdirectory = "crypto-market-type" }
crypto-msg-type = { git = "https://github.com/mightybyte/crypto-crawler-rs.git", branch = "binance-us", subdirectory = "crypto-msg-type" }
crypto-rest-client = { git = "https://github.com/mightybyte/crypto-crawler-rs.git", branch = "binance-us", subdirectory = "crypto-rest-client" }
crypto-ws-client = { git = "https://github.com/mightybyte/crypto-crawler-rs.git", branch = "binance-us", subdirectory = "crypto-ws-client" }

crypto-contract-value = { git = "https://github.com/mightybyte/crypto-msg-parser.git", branch = "mb/bump-protobuf", subdirectory = "crypto-contract-value" }
crypto-message = { git = "https://github.com/mightybyte/crypto-msg-parser.git", branch = "mb/bump-protobuf", subdirectory = "crypto-message" }
crypto-msg-parser = { git = "https://github.com/mightybyte/crypto-msg-parser.git", branch = "mb/bump-protobuf", subdirectory = "crypto-msg-parser" }
crypto-pair = { git = "https://github.com/mightybyte/crypto-msg-parser.git", branch = "mb/bump-protobuf", subdirectory = "crypto-pair" }
